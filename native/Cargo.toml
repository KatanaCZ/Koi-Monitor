[package]
name = "koi-monitor"
version = "2.0.0-alpha.1"
description = "Koi Monitor - Windows system monitor (native UI, no WebView)"
authors = ["Katana"]
license = "MIT"
edition = "2021"

[[bin]]
name = "koi-monitor"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "canvas", "svg", "tokio", "web-colors", "advanced"] }
iced_wgpu = "0.14"
bytemuck = { version = "1", features = ["derive"] }
sysinfo = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["net", "time", "sync", "rt"] }
wmi = "0.13"
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dxgi",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
